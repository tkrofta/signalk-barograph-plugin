# NPM Release
name: npm-release

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]

jobs:
  publish:
    name: Check release to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if version has been updated
        id: check
        uses: EndBug/version-check@v2
        with:
          file-url: https://unpkg.com/signalk-barograph@latest/package.json
          static-checking: localIsNew

      - name: Log when unchanged
        if: steps.check.outputs.changed == 'false'
        run: 'echo "Non release change"'

      - name: Log when changed
        if: steps.check.outputs.changed == 'true'
        run: 'echo "Version changed commit ${{ steps.check.outputs.commit }}! New version: ${{ steps.check.outputs.version }} (${{ steps.check.outputs.type }})"'

      - name: Check if release exists
        if: steps.check.outputs.changed == 'true'
        id: release_exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --oauth2-bearer "$GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.check.outputs.version }}")
          if [ "$STATUS_CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists for version ${{ steps.check.outputs.version }}"
          elif [ "$STATUS_CODE" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Failed to check release status (HTTP $STATUS_CODE)"
            exit 1
          fi
        
      - name: Create Release
        if: steps.check.outputs.changed == 'true' && steps.release_exists.outputs.exists != 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ steps.check.outputs.version }}
          release_name: Release ${{ steps.check.outputs.version }} (${{ steps.check.outputs.type }})
          body: |
            New release to NPM
            - Tagged to ${{ steps.check.outputs.version }}
            - Release ${{ steps.check.outputs.version }} (${{ steps.check.outputs.type }})
          draft: false
          prerelease: false
          
      - name: Setup Node
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Install Package 
        if: steps.check.outputs.changed == 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}
      - name: Publish Package 
        if: steps.check.outputs.changed == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}
